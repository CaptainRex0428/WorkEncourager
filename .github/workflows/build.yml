name: Build Windows x64

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Dist x64
        shell: cmd
        run: Scripts\BuildWIN.bat --no-pause

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkEncourager-x64
          path: |
            dist/WorkEncourager.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/WorkEncourager.exe dist/SHA256SUMS.txt --title "Work Encourager $env:GITHUB_REF_NAME" --generate-notes
